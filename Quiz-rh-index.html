*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#202536;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 16px}.head{text-align:center;margin-bottom:20px}.tag{display:inline-block;background:#e9e6ff;color:#5141bd;border-radius:30px;padding:7px 13px;font-size:13px;font-weight:bold}h1{font-size:34px;margin:12px 0 8px}.sub{color:#687083}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 12px 35px #00000012}.top{display:flex;justify-content:space-between;color:#697386;font-weight:bold;font-size:14px}.progress{height:8px;background:#e8eaf0;border-radius:8px;margin:12px 0 25px;overflow:hidden}.bar{height:100%;background:#5b4bdb;width:12.5%;transition:.2s}h2{font-size:23px;line-height:1.3}.options{display:grid;gap:12px}.option{width:100%;padding:16px;border:2px solid #e0e3ea;background:white;border-radius:15px;text-align:left;font-size:16px;cursor:pointer}.option:hover,.selected{border-color:#5b4bdb;background:#f4f2ff}.nav{display:flex;justify-content:space-between;margin-top:22px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer;background:#e9ebf1}.primary{background:#5b4bdb;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.result{text-align:center}.result img{width:100%;max-width:500px;max-height:400px;object-fit:cover;border-radius:18px;margin:16px auto;display:block}.result h2{margin:8px}.desc{color:#687083;line-height:1.5;font-size:17px}.traits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.trait{background:#eef0f5;padding:8px 12px;border-radius:20px;font-weight:bold;font-size:14px}</style></head><body><div class="wrap"><div class="head"><span class="tag">QUIZ • PERFIL NO RH</span><h1>Qual animal representa seu perfil no RH?</h1><p class="sub">Responda às 8 perguntas e descubra seu perfil no final.</p></div><div class="card"><section id="quiz"><div class="top"><span id="counter"></span><span>8 perguntas</span></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div class="nav"><button class="btn" id="back">← Voltar</button><button class="btn primary" id="next" disabled>Próxima →</button></div></section><section id="result" class="result hidden"><div id="emoji" style="font-size:52px"></div><h2 id="title"></h2><div class="traits" id="traits"></div><img id="image"><p class="desc" id="desc"></p><button class="btn primary" id="again">Refazer quiz</button></section></div></div><script>
